<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191C21">
<meta name="application-name" content="Road Ready Permit Practice">
<title>Road Ready Permit Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#191C21; --asphalt-2:#22262D; --asphalt-3:#2C323A; --edge:#3A424C;
  --concrete:#F3F4F2; --concrete-dim:#9AA3AE;
  --fed-yellow:#FFCC00; --fed-red:#AF1E2D; --fed-green:#00794A; --fed-orange:#F58220; --fed-blue:#0B5EA8;
  --green-lit:#12A365; --red-lit:#E0394A;
  --sign-white:#FFFFFF;
  --ui:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-btn:8px; --r-panel:16px; --r-sign:4px;
  --sh1:inset 0 1px 0 rgba(255,255,255,.04);
  --sh2:0 6px 20px rgba(0,0,0,.38);
  --sh3:0 14px 40px rgba(0,0,0,.5);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--asphalt);
  background-image:radial-gradient(120% 80% at 50% 0%,#1F242B 0%,#191C21 55%,#141619 100%);
  color:var(--concrete); font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--fed-yellow);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{
  max-width:460px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1C2027 0%,#171A1F 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 80px rgba(0,0,0,.6);
  position:relative;overflow:hidden;
}
header{
  display:flex;align-items:center;gap:10px;padding:10px 16px;height:56px;flex:none;
  border-bottom:1px solid var(--edge);background:var(--asphalt-2);
  padding-top:calc(10px + env(safe-area-inset-top));height:calc(56px + env(safe-area-inset-top));
}
.plate{
  display:flex;align-items:center;gap:7px;background:var(--sign-white);color:#111;
  border-radius:5px;padding:4px 9px;font-weight:900;font-size:12px;letter-spacing:.06em;
  border:2px solid #d8dad6;box-shadow:0 1px 0 rgba(0,0,0,.4);
}
.plate b{color:var(--fed-red);font-size:12px}
.plate span{font-family:var(--mono);font-size:11px;color:#444;font-weight:700}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:var(--asphalt-3);border:1px solid var(--edge);color:var(--concrete-dim);
}
.chip.hot{color:var(--fed-yellow);border-color:#6b5a12;background:#302a13}

/* ---------- milepost ---------- */
.milepost{flex:none;padding:14px 16px 12px;border-bottom:1px solid var(--edge);background:var(--asphalt-2)}
.mp-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--concrete-dim);margin-bottom:9px;display:flex;justify-content:space-between}
.mp-label b{color:var(--fed-yellow);font-family:var(--mono);letter-spacing:0}
.road{
  position:relative;height:34px;border-radius:3px;background:var(--asphalt-3);
  border-top:2px solid #545c66;border-bottom:2px solid #545c66;overflow:hidden;
}
.road-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#00844F,#00623A);transition:width .62s ease-out}
.road-line{
  position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,var(--fed-yellow) 0 14px,transparent 14px 28px);
  opacity:.9;
}
.road-mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.22)}
.road-mark::after{content:attr(data-m);position:absolute;top:2px;left:4px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.4)}

/* ---------- view ---------- */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen{padding:18px 16px 26px;animation:enter .2s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--concrete-dim);margin:0 0 8px}
h1{font-size:30px;font-weight:900;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase;margin:0 0 4px}
h2{font-size:21px;font-weight:800;line-height:1.15;text-transform:uppercase;margin:0 0 10px}
p.lede{font-family:var(--serif);font-size:16px;line-height:1.55;color:#C6CCD4;margin:0 0 18px}

/* ---------- panels ---------- */
.panel{background:var(--asphalt-2);border:1px solid var(--edge);border-radius:var(--r-panel);padding:20px;box-shadow:var(--sh1);margin-bottom:14px}
.panel-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--concrete-dim);margin:0 0 14px;display:flex;align-items:center;justify-content:space-between}

/* ---------- gauges ---------- */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.gauge{background:var(--asphalt-2);border:1px solid var(--edge);border-radius:var(--r-panel);padding:16px 12px;text-align:center;box-shadow:var(--sh1)}
.gauge svg{display:block;margin:0 auto}
.gauge .num{font-family:var(--mono);font-size:26px;font-weight:700}
.gauge .cap{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--concrete-dim);margin-top:8px}
.gauge .sub{font-family:var(--mono);font-size:11px;color:var(--concrete-dim);margin-top:3px}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;
  border-radius:var(--r-btn);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--fed-yellow);color:#1A1608;box-shadow:0 3px 0 #B58F00;transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #B58F00}
.btn.ghost{background:transparent;color:var(--concrete);border:1px solid var(--edge);box-shadow:none}
.btn.ghost:active{transform:none;background:var(--asphalt-3)}
.btn.danger{background:transparent;color:#E0868F;border:1px solid #6E2630;box-shadow:none}
.btn:disabled{opacity:.34;border:1px dashed var(--edge);background:transparent;color:var(--concrete-dim);box-shadow:none;cursor:not-allowed}
.btn-row{display:flex;gap:10px}

/* ---------- drill tiles ---------- */
.tile{
  display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;margin-bottom:10px;
  background:var(--asphalt-2);border:1px solid var(--edge);border-radius:var(--r-panel);box-shadow:var(--sh1);
  transition:border-color .15s,transform .1s;
}
.tile:active{transform:scale(.99);border-color:var(--fed-yellow)}
.tile-ico{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--asphalt-3);border:1px solid var(--edge)}
.tile-n{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.tile-d{font-family:var(--serif);font-size:14px;color:var(--concrete-dim);line-height:1.4;margin-top:2px}

/* ---------- question card ---------- */
.qcard{
  background:var(--asphalt-2);border:1px solid var(--edge);border-radius:var(--r-panel);
  padding:20px;box-shadow:var(--sh2);position:relative;overflow:hidden;
  animation:cardin .18s var(--ease) both;
}
@keyframes cardin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.qtext{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 16px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:14px;margin-bottom:10px;
  background:var(--asphalt-3);border:1px solid var(--edge);border-radius:var(--r-btn);
  font-size:15.5px;font-weight:500;line-height:1.4;transition:background .12s,border-color .12s;
}
.opt:active{background:#353C46}
.opt .k{
  flex:none;width:22px;height:22px;border-radius:5px;background:#3D4550;color:var(--concrete-dim);
  font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px;
}
.opt.right{background:rgba(0,121,74,.22);border-color:var(--green-lit)}
.opt.right .k{background:var(--green-lit);color:#04140C}
.opt.wrong{background:rgba(175,30,45,.2);border-color:var(--red-lit)}
.opt.wrong .k{background:var(--red-lit);color:#1A0508}
.opt:disabled{opacity:1;cursor:default}
.opt.dim{opacity:.42}
.sweep{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--green-lit);animation:sweep .34s ease-out forwards}
@keyframes sweep{to{width:100%}}
.shake{animation:shake .24s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}

/* ---------- explanation ---------- */
.why{
  margin-top:14px;padding:15px 16px;border-radius:12px;background:var(--asphalt-3);
  border-left:4px solid var(--fed-yellow);animation:enter .22s var(--ease) both;
}
.why .v{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
.why .v.ok{color:var(--green-lit)} .why .v.no{color:#F1707D}
.why p{font-family:var(--serif);font-size:15.5px;line-height:1.55;margin:0;color:#D3D8DE}
.why .src{display:block;margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--concrete-dim);letter-spacing:.02em}

/* ---------- progress bar in drill ---------- */
.drillbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--edge);background:var(--asphalt-2);flex:none}
.drillbar .track{flex:1;height:6px;border-radius:999px;background:var(--asphalt-3);overflow:hidden}
.drillbar .fill{height:100%;background:var(--fed-yellow);transition:width .3s var(--ease)}
.drillbar .ct{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--concrete-dim)}
.xbtn{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--concrete-dim);padding:6px 8px}

/* ---------- sign rendering ---------- */
.signbox{display:grid;place-items:center;background:var(--asphalt-3);border-radius:12px;padding:14px;border:1px solid var(--edge)}
.signbox svg{width:100%;height:auto;max-width:150px;display:block}
.sign-sm svg{max-width:74px}

/* ---------- match board ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mtile{
  background:var(--asphalt-3);border:2px solid var(--edge);border-radius:10px;padding:10px;
  display:grid;place-items:center;min-height:96px;transition:border-color .12s,background .12s,opacity .2s;
}
.mtile svg{width:100%;max-width:80px;height:auto}
.mtile.sel{border-color:var(--fed-yellow);background:#332D14}
.mtile.done{opacity:.3;border-color:var(--green-lit);pointer-events:none}
.nlist{display:flex;flex-direction:column;gap:8px}
.ntile{
  background:var(--asphalt-3);border:2px solid var(--edge);border-radius:var(--r-btn);padding:13px 14px;
  text-align:left;font-size:14.5px;font-weight:600;line-height:1.3;transition:border-color .12s,background .12s,opacity .2s;
}
.ntile.sel{border-color:var(--fed-yellow);background:#332D14}
.ntile.done{opacity:.3;border-color:var(--green-lit);pointer-events:none}

/* ---------- swipe deck ---------- */
.deck{position:relative;height:400px;margin-bottom:24px}
.swipe{
  position:absolute;inset:0;background:var(--asphalt-2);border:1px solid var(--edge);border-radius:20px;
  padding:24px;box-shadow:var(--sh3);display:flex;flex-direction:column;justify-content:center;
  touch-action:none;user-select:none;
}
.swipe.under{transform:scale(.94) translateY(29px);opacity:.62;box-shadow:none}
.swipe .st{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--concrete-dim);margin-bottom:14px}
.swipe .sq{font-size:21px;font-weight:600;line-height:1.35}
.stamp{
  position:absolute;top:26px;font-size:26px;font-weight:900;letter-spacing:.06em;padding:6px 14px;
  border:4px solid;border-radius:8px;opacity:0;transition:opacity .1s;
}
.stamp.t{left:24px;transform:rotate(-12deg);color:var(--green-lit);border-color:var(--green-lit)}
.stamp.f{right:24px;transform:rotate(12deg);color:var(--red-lit);border-color:var(--red-lit)}
.swipehint{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--concrete-dim);margin-bottom:10px}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfbtn{min-height:56px;border-radius:var(--r-btn);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border:2px solid}
.tfbtn.f{border-color:#6E2630;color:#E0868F;background:rgba(175,30,45,.12)}
.tfbtn.t{border-color:#155E42;color:#5FD3A0;background:rgba(0,121,74,.14)}
.tfbtn:active{transform:translateY(1px)}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--edge)}
.row:last-child{border-bottom:0}
.row .txt{flex:1;font-size:14.5px;line-height:1.35}
.row .meta{font-family:var(--mono);font-size:12px;color:var(--concrete-dim);flex:none}
.bar{height:8px;border-radius:999px;background:var(--asphalt-3);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s var(--ease)}
.dot{width:9px;height:9px;border-radius:999px;flex:none}
.empty{font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--concrete-dim);margin:0}

/* ---------- segmented ---------- */
.seg{display:flex;gap:4px;padding:4px;background:var(--asphalt-3);border-radius:999px;margin-bottom:16px;border:1px solid var(--edge)}
.seg button{flex:1;padding:9px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--concrete-dim)}
.seg button.on{background:var(--concrete);color:#16191D}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:7px 13px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--asphalt-3);border:1px solid var(--edge);color:var(--concrete-dim)}
.filters button.on{background:var(--fed-yellow);color:#1A1608;border-color:var(--fed-yellow)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:400px){.gal{grid-template-columns:repeat(3,1fr)}}
.gcard{background:var(--asphalt-2);border:1px solid var(--edge);border-radius:12px;padding:12px 8px;text-align:center;position:relative}
.gcard svg{width:100%;max-width:66px;height:auto;margin:0 auto 8px;display:block}
.gcard .gn{font-size:11.5px;font-weight:700;line-height:1.25}
.gcard .gd{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:999px}

/* accordion */
.acc{background:var(--asphalt-2);border:1px solid var(--edge);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;text-align:left;font-size:14.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.acc .body{padding:0 16px 16px;font-family:var(--serif);font-size:15px;line-height:1.6;color:#C6CCD4}
.acc .body ul{margin:0;padding-left:18px}
.acc .body li{margin-bottom:7px}
.acc .body b{color:var(--fed-yellow);font-family:var(--ui);font-weight:700;font-size:14px}

/* results plate */
.result{background:var(--sign-white);color:#16191D;border-radius:14px;padding:20px;border:3px solid #C9CCC6;margin-bottom:14px;text-align:center}
.result .rt{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#5A6068}
.result .rv{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin:6px 0 2px;text-transform:uppercase}
.result .rs{font-family:var(--mono);font-size:14px;font-weight:700;color:#3A4048}
.result.pass .rv{color:#00623A} .result.fail .rv{color:#9A1626}

/* ---------- nav ---------- */
nav{
  display:flex;flex:none;border-top:1px solid var(--edge);background:var(--asphalt-2);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:10px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--concrete-dim);position:relative}
nav button.on{color:var(--fed-yellow)}
nav .lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}

.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

{id:'m7',t:'Right of Way',q:'You are entering a road from a private driveway. What must you do?',o:['Stop and yield to all traffic and to anyone on the sidewalk','Merge without stopping if the road is clear','Sound your horn and proceed','Yield only to vehicles, not pedestrians'],a:0,w:'Entering or crossing a highway from an alley, private road, or driveway requires you to stop and yield to all pedestrians and vehicles already on the roadway or sidewalk.',src:'Manual, Section 5'},
{id:'m8',t:'Right of Way',q:'An emergency vehicle approaches with lights and siren. You should:',o:['Slow, pull to the right edge or shoulder, and stop','Speed up to clear the intersection','Stop where you are, even in an intersection','Move to the left lane'],a:0,w:'Pull safely to the right and stop. Never stop in a position that blocks an intersection or prevents the emergency vehicle from turning.',src:'Manual, Section 5'},
{id:'m9',t:'Right of Way',q:'When entering a roundabout you must:',o:['Yield to traffic already circulating','Stop completely before entering','Yield to traffic waiting to enter','Enter to the left and circle clockwise'],a:0,w:'Yield to all vehicles already in the roundabout, enter to the right, travel counterclockwise, never change lanes inside, and exit right.',src:'Manual, Section 7'},
{id:'m10',t:'Speed & Limits',q:'Unless otherwise posted, the maximum speed in an urban or residential district is:',o:['30 mph','25 mph','35 mph','45 mph'],a:0,w:'Georgia sets 30 mph as the general limit in urban and residential districts unless a sign says otherwise.',src:'Manual, Section 5'},
{id:'m11',t:'Speed & Limits',q:'Unless posted otherwise, the maximum speed on a rural interstate is:',o:['70 mph','65 mph','75 mph','60 mph'],a:0,w:'Rural interstates are 70 mph. Urban interstates and multi-lane divided highways are 65 mph.',src:'Manual, Section 5'},
{id:'m12',t:'Speed & Limits',q:'Unless posted otherwise, the maximum speed on an unpaved county road is:',o:['35 mph','30 mph','45 mph','55 mph'],a:0,w:'Unpaved county roads carry a 35 mph general limit.',src:'Manual, Section 5'},
{id:'m13',t:'Speed & Limits',q:'If no other limit is posted and none of the specific rules apply, the general Georgia speed limit is:',o:['55 mph','50 mph','60 mph','65 mph'],a:0,w:'55 mph applies in all other areas not covered by the specific categories.',src:'Manual, Section 5'},
{id:'m14',t:'Speed & Limits',q:'Georgia\u2019s Super Speeder fee applies to a driver convicted of:',o:['75 mph or more on a two-lane road, or 85 mph or more on any road','80 mph anywhere in the state','65 mph in a work zone','Any speed over the posted limit'],a:0,w:'Super Speeder adds a $200 state fee on top of local fines. Failing to pay it brings a suspension and a $50 reinstatement fee.',src:'Manual, Section 5'},
{id:'m15',t:'Speed & Limits',q:'Driving too slowly and impeding traffic can bring:',o:['A fine up to $1,000 and 3 points','A warning only','No penalty if under the limit','Immediate license revocation'],a:0,w:'Georgia prohibits driving so slowly that it impedes normal traffic, and it carries a fine up to $1,000 and 3 points.',src:'Manual, Section 5'},
{id:'m16',t:'Signs & Signals',q:'What does a diamond-shaped sign always indicate?',o:['A warning of a hazard or change ahead','A regulation you must obey','Directions to a service','A construction detour'],a:0,w:'Diamonds are warning signs, usually yellow with black symbols, sometimes fluorescent yellow-green for pedestrian and school crossings.',src:'Manual, Section 7'},
{id:'m17',t:'Signs & Signals',q:'A round sign means:',o:['A railroad crossing is ahead','A roundabout is ahead','A speed limit change','A rest area is ahead'],a:0,w:'The round sign is the railroad advance warning, posted a few hundred feet before the tracks.',src:'Manual, Section 7'},
{id:'m18',t:'Signs & Signals',q:'A pentagon-shaped sign means:',o:['A school zone or school crossing','A hospital ahead','A five-way intersection','A scenic route'],a:0,w:'Pentagons mark school zones and crossings and are posted 150 to 700 feet in advance.',src:'Manual, Section 7'},
{id:'m19',t:'Signs & Signals',q:'Orange signs with black markings mean:',o:['Work zone or maintenance area','Recreational area','School crossing','Emergency detour only'],a:0,w:'Orange is the work zone color. Watch for it and expect reduced speeds and changing lane patterns.',src:'Manual, Section 5'},
{id:'m20',t:'Signs & Signals',q:'A flashing red light at an intersection means:',o:['Stop completely, then proceed when safe','Slow down and continue','The signal is broken, proceed freely','Stop only if traffic is present'],a:0,w:'A flashing red is treated exactly like a stop sign: full stop, yield, then go.',src:'Manual, Section 7'},
{id:'m21',t:'Signs & Signals',q:'A flashing yellow arrow for a left turn means:',o:['You may turn left after yielding to oncoming traffic','You have a protected left turn','Left turns are prohibited','Stop before turning left'],a:0,w:'A flashing yellow arrow permits a left turn after yielding. Oncoming traffic still has a green light.',src:'Manual, Section 7'},
{id:'m22',t:'Signs & Signals',q:'A steady yellow X over a lane means:',o:['Clear the lane','The lane is open','Left turns permitted','Slow down in this lane'],a:0,w:'Steady yellow X means clear the lane. Flashing yellow X means a left turn is permitted from it.',src:'Manual, Section 7'},
{id:'m23',t:'Signs & Signals',q:'A flashing DON\u2019T WALK signal means a pedestrian should:',o:['Not start crossing, but finish if already crossing','Start crossing quickly','Wait at the median','Cross only with a vehicle'],a:0,w:'Flashing means do not leave the curb, but complete the crossing if already underway.',src:'Manual, Section 7'},
{id:'m24',t:'Signs & Signals',q:'A red circle with a slash on a sign means:',o:['The action shown inside is prohibited','Caution is advised','The road is closed','A hazard is ahead'],a:0,w:'The red circle and slash mean "no." The picture inside shows exactly what is banned.',src:'Manual, Section 7'},
{id:'m25',t:'Signs & Signals',q:'Blue and white signs give you:',o:['Motorist services such as food, gas, lodging, and hospitals','Warnings of upcoming hazards','Speed regulations','Construction information'],a:0,w:'Blue is the motorist services color. Green is for guide and direction, brown for recreation.',src:'Manual, Section 7'},
{id:'m26',t:'Pavement Markings',q:'A solid yellow line on your side of the center line means:',o:['You may not pass','You may pass with caution','The road is one-way','A shoulder is ahead'],a:0,w:'A solid yellow line to the right of the center line means no passing from your lane. Double solid yellow means no passing either direction.',src:'Manual, Section 7'},
{id:'m27',t:'Pavement Markings',q:'Double solid white lines between lanes mean:',o:['Lane changes are prohibited','Lane changes are allowed','A bicycle lane begins','Traffic ahead merges'],a:0,w:'Solid double white lines prohibit lane changes. Dashed double white lines allow crossing.',src:'Manual, Section 7'},
{id:'m28',t:'Pavement Markings',q:'Diagonal yellow striping on the pavement tells you to:',o:['Keep to the right of the markings','Cross only to pass','Stop before entering','Merge left immediately'],a:0,w:'Diagonal yellow striping marks a narrowing road or an obstruction. Always keep to the right of it.',src:'Manual, Section 7'},
{id:'m29',t:'Pavement Markings',q:'A center lane bordered by solid and broken yellow lines may be used only for:',o:['Making left turns','Passing slower traffic','Merging onto the highway','Emergency stops'],a:0,w:'Georgia law limits the two-way center turn lane to left turns, and you may enter it no more than 300 feet before the turn.',src:'Manual, Section 7'},
{id:'m30',t:'Pavement Markings',q:'When stopping at an intersection with a marked stop line, you must stop:',o:['At the stop line','At the stop sign itself','In the crosswalk','Wherever you can see best'],a:0,w:'Drivers stop at the stop line when one is present, not at the sign or signal.',src:'Manual, Section 7'},
{id:'m31',t:'Passing',q:'Passing is prohibited within how many feet of a railroad crossing or bridge?',o:['100 feet','50 feet','200 feet','300 feet'],a:0,w:'No passing within 100 feet of a railroad crossing, bridge, viaduct, or tunnel.',src:'Manual, Section 5'},
{id:'m32',t:'Passing',q:'You may not begin a pass if oncoming traffic will be within how many feet before you finish?',o:['200 feet','100 feet','300 feet','500 feet'],a:0,w:'You must be able to complete the pass and return fully to your lane before oncoming traffic is within 200 feet.',src:'Manual, Section 5'},
{id:'m33',t:'Passing',q:'When passing a bicycle and you cannot change lanes, Georgia law requires you to:',o:['Slow to at least 10 mph under the limit or 25 mph, whichever is more, and leave 3 feet','Sound your horn and pass close','Wait until the cyclist leaves the road','Pass at the posted speed with 1 foot of space'],a:0,w:'Change lanes when possible. If not, reduce speed to at least 10 mph below the posted limit or 25 mph, whichever is greater, and pass with at least three feet of clearance.',src:'Manual, Section 5'},
{id:'m34',t:'Passing',q:'When passing a motorcycle you must:',o:['Move fully into an adjacent lane','Share the lane if there is room','Pass on the shoulder','Follow closely until the motorcycle moves over'],a:0,w:'A motorcyclist legally occupies the full width of the lane. Drivers may not share the lane while passing.',src:'Manual, Section 5'},
{id:'m35',t:'Passing',q:'Flashing your headlights or turn signals to tell the driver behind you it is safe to pass is:',o:['Illegal in Georgia','Recommended courtesy','Required at night','Allowed on two-lane roads only'],a:0,w:'Georgia law makes it illegal to flash signals as a courtesy or "do pass" signal to drivers behind you.',src:'Manual, Section 5'},
{id:'m36',t:'Passing',q:'Someone is passing you. It is unlawful to:',o:['Increase your speed before they have fully passed','Slow down slightly','Stay in your lane','Move toward the right edge'],a:0,w:'You may not speed up until the overtaking vehicle has completely passed you. Slowing slightly is the courteous move.',src:'Manual, Section 5'},
{id:'m37',t:'Parking & Stopping',q:'You may not park within how many feet of a fire hydrant?',o:['15 feet','10 feet','20 feet','30 feet'],a:0,w:'15 feet from a fire hydrant. Momentary stops to load or drop off passengers are the only exception.',src:'Manual, Section 5'},
{id:'m38',t:'Parking & Stopping',q:'You may not park within how many feet of a stop sign, yield sign, or traffic signal?',o:['30 feet','15 feet','20 feet','50 feet'],a:0,w:'30 feet from a stop sign, yield sign, or traffic control signal.',src:'Manual, Section 5'},
{id:'m39',t:'Parking & Stopping',q:'You may not park within how many feet of a railroad crossing?',o:['50 feet','25 feet','75 feet','100 feet'],a:0,w:'50 feet from a railroad crossing.',src:'Manual, Section 5'},
{id:'m40',t:'Parking & Stopping',q:'You may not park within how many feet of a crosswalk at an intersection?',o:['20 feet','10 feet','30 feet','40 feet'],a:0,w:'20 feet from a crosswalk at an intersection, and also 20 feet from a fire station driveway.',src:'Manual, Section 5'},
{id:'m41',t:'Parking & Stopping',q:'Your car breaks down on a highway. You should park where your vehicle is visible for at least:',o:['200 feet in each direction','100 feet in each direction','50 feet in each direction','500 feet in each direction'],a:0,w:'Move off the highway if at all possible, leaving free passage and a clear view of your vehicle for 200 feet in each direction.',src:'Manual, Section 5'},
{id:'m42',t:'Teen Licensing',q:'A Class C Instructional Permit holder may drive only when accompanied by:',o:['A licensed driver 21 or older seated beside them','Any licensed driver','A parent only','A licensed driver 18 or older'],a:0,w:'The supervising driver must be at least 21, licensed for Class C, capable of taking control, and seated beside the driver.',src:'Manual, Section 6'},
{id:'m43',t:'Teen Licensing',q:'What is the minimum age to apply for a Class C Instructional Permit in Georgia?',o:['15','16','14','17'],a:0,w:'You may apply at 15. The permit is valid for two years.',src:'Manual, Section 6'},
{id:'m44',t:'Teen Licensing',q:'A Class D provisional license holder may not drive between:',o:['12:00 a.m. and 5:00 a.m., with no exceptions','11:00 p.m. and 6:00 a.m.','1:00 a.m. and 4:00 a.m.','Midnight and 6:00 a.m. unless working'],a:0,w:'The Class D curfew runs midnight to 5:00 a.m. and the manual states it has no exceptions.',src:'Manual, Section 6'},
{id:'m45',t:'Teen Licensing',q:'During the first six months with a Class D license, who may ride along?',o:['Only immediate family members','One friend under 21','Up to three friends','Anyone with a seat belt'],a:0,w:'First six months: immediate family only. Second six months: one non-family passenger under 21. After that: up to three.',src:'Manual, Section 6'},
{id:'m46',t:'Teen Licensing',q:'How long must you hold an instructional permit before applying for a Class D license?',o:['One year and one day','Six months','Nine months','Two years'],a:0,w:'You must be 16 and have held a valid instructional permit for one year and one day.',src:'Manual, Section 6'},
{id:'m47',t:'Teen Licensing',q:'Joshua\u2019s Law requires a 16-year-old applying for a Class D license to complete driver education plus:',o:['40 hours of supervised driving, 6 of them at night','20 hours of supervised driving','60 hours of supervised driving, 10 at night','No additional driving hours'],a:0,w:'An approved course of 30 classroom hours or the online equivalent, 6 hours on the road or the Parent/Teen Guide, and a cumulative 40 hours of driving including 6 at night.',src:'Manual, Section 6'},
{id:'m48',t:'Teen Licensing',q:'For a driver under 18, how many points in 12 months will suspend the license?',o:['4 points','15 points','10 points','6 points'],a:0,w:'Under 18, accumulating 4 or more points in any 12-month period suspends the license. The adult threshold is 15 points in 24 months.',src:'Manual, Section 6'},
{id:'m49',t:'Teen Licensing',q:'The adult who signed a minor\u2019s permit application may:',o:['Revoke the permit at any time before the minor turns 18','Never revoke it once issued','Revoke it only for traffic convictions','Transfer it to another adult'],a:0,w:'The signing parent, guardian, or responsible adult can request revocation for any reason before the minor turns 18.',src:'Manual, Section 6'},
{id:'m50',t:'Alcohol & Penalties',q:'A driver under 21 is legally under the influence at a blood alcohol level of:',o:['0.02','0.08','0.05','0.10'],a:0,w:'Georgia\u2019s zero-tolerance level for drivers under 21 is 0.02. For drivers 21 and over it is 0.08.',src:'Manual, Section 5'},
{id:'m51',t:'Alcohol & Penalties',q:'Having a valid prescription for a medication that impairs your driving is:',o:['Not a defense to a DUI charge','A complete defense','A defense if you tell the officer','A defense for a first offense only'],a:0,w:'A prescription is not a defense if the medication impairs your ability to drive safely.',src:'Manual, Section 5'},
{id:'m52',t:'Alcohol & Penalties',q:'How many points in a 24-month period will suspend an adult Georgia license?',o:['15 points','10 points','12 points','20 points'],a:0,w:'15 or more points in any consecutive 24-month period triggers suspension. Points reset to zero after a points suspension.',src:'Manual, Section 10'},
{id:'m53',t:'Alcohol & Penalties',q:'For a driver under 21, a conviction for reckless driving results in:',o:['Suspension of all driving privileges','Points only','A fine only','A warning for the first offense'],a:0,w:'For drivers under 21, reckless driving, racing, aggressive driving, hit and run, and eluding all bring a suspension: 6 months for a first conviction, 12 for a second.',src:'Manual, Sections 5 and 6'},
{id:'m54',t:'Safe Driving',q:'The Georgia manual\u2019s method for checking following distance is to count:',o:['"One-thousand-one, one-thousand-two" as the car ahead passes a fixed point','Three full seconds','Four car lengths','One car length per 10 mph'],a:0,w:'Watch the vehicle ahead pass a landmark and count two seconds. Passing the same point before you finish counting means you are too close. Increase the gap at night, in rain, and in construction.',src:'Manual, Section 8'},
{id:'m55',t:'Safe Driving',q:'If your vehicle begins to hydroplane you should:',o:['Ease your foot off the accelerator and let the car slow','Brake firmly','Steer sharply toward the shoulder','Accelerate to regain traction'],a:0,w:'Take your foot off the accelerator and let the vehicle slow. Braking or steering sharply while hydroplaning can throw the car into an uncontrollable skid.',src:'Manual, Section 8'},
{id:'m56',t:'Safe Driving',q:'Partial hydroplaning can begin at speeds as low as:',o:['35 mph','55 mph','45 mph','25 mph'],a:0,w:'Tires channel water well up to about 35 mph. Above that, partial hydroplaning starts, and at 55 mph the tires can lose contact with the road entirely.',src:'Manual, Section 8'},
{id:'m57',t:'Safe Driving',q:'You must use headlights from:',o:['A half hour after sunset to a half hour before sunrise, in rain, and when visibility is limited','Sunset to sunrise only','Only when it is fully dark','Only on unlit roads'],a:0,w:'Headlights are required from a half hour after sunset until a half hour before sunrise, at any time it is raining, and whenever visibility is limited.',src:'Manual, Section 5'},
{id:'m58',t:'Safe Driving',q:'You must dim your high beams within how many feet of an oncoming vehicle?',o:['500 feet','200 feet','300 feet','1,000 feet'],a:0,w:'Dim within 500 feet of an oncoming vehicle and within 200 feet when following another vehicle.',src:'Manual, Section 5'},
{id:'m59',t:'Safe Driving',q:'In heavy fog you should:',o:['Slow down and use low beams','Use high beams for visibility','Turn on hazard lights and continue at speed','Follow closely behind another vehicle'],a:0,w:'High beams reflect off fog and make visibility worse. Slow down, use low beams, and reduce speed further when you see other headlights or tail lights.',src:'Manual, Section 8'},
{id:'m60',t:'Safe Driving',q:'Georgia\u2019s seat belt law requires belts for:',o:['All front-seat occupants, and everyone under 18 anywhere in the vehicle','The driver only','Front-seat occupants only','Everyone in every seat, all ages'],a:0,w:'Front-seat occupants must be belted, and all occupants under 18 must be belted in any seat. Georgia is a primary enforcement state.',src:'Manual, Section 5'},
{id:'m61',t:'Safe Driving',q:'Child passenger restraints are required for children under:',o:['8 years old','5 years old','10 years old','12 years old'],a:0,w:'Drivers must properly restrain any child under eight in a system appropriate to the child\u2019s height and weight.',src:'Manual, Section 5'},
{id:'m62',t:'Safe Driving',q:'Coasting downhill with the transmission in neutral is:',o:['Prohibited by law','Recommended to save fuel','Allowed below 35 mph','Allowed on rural roads'],a:0,w:'Georgia law forbids coasting downhill in neutral, because it removes engine braking and control.',src:'Manual, Section 5'},
{id:'m63',t:'Safe Driving',q:'Wearing headphones while driving in Georgia is:',o:['Unlawful, because it impairs your ability to hear','Legal at low volume','Legal if only one ear is covered','Legal for passengers and drivers alike'],a:0,w:'It is unlawful to drive while wearing a headphone, headset, or anything else that impairs hearing or obstructs vision.',src:'Manual, Section 5'},
{id:'m64',t:'Work Zones & Rail',q:'In a work zone, a flagger\u2019s directions carry:',o:['The same authority as a regulatory sign','Less authority than a posted sign','Authority only when police are present','Advisory weight only'],a:0,w:'A flagger has the same authority as a regulatory sign. Disobeying a flagger is a violation.',src:'Manual, Section 5'},
{id:'m65',t:'Work Zones & Rail',q:'When you must stop for a train, you stop within:',o:['50 feet but not less than 15 feet from the nearest rail','25 feet of the crossing','100 feet of the crossing','10 feet of the nearest rail'],a:0,w:'Stop within 50 feet but not less than 15 feet from the nearest rail, and stay stopped until the tracks are clear and gates are up.',src:'Manual, Section 5'},
{id:'m66',t:'Work Zones & Rail',q:'Speeding in a work zone in Georgia can bring a fine of:',o:['Not less than $100 and up to $2,000','A flat $50','Up to $500 only','No fine on a first offense'],a:0,w:'Disobeying a regulatory speed limit in a work zone is a high and aggravated misdemeanor: $100 to $2,000, up to 12 months, or both.',src:'Manual, Section 5'},
{id:'m67',t:'Work Zones & Rail',q:'Your car stalls on railroad tracks. You should:',o:['Get out immediately, move away, and call for help using the ENS sign','Stay inside and restart the engine','Push the vehicle off the tracks alone','Wait for the crossing gates to lift'],a:0,w:'Get out and move away at once, then find the Emergency Notification System sign at the crossing and call the number on it.',src:'Manual, Section 5'},
{id:'m68',t:'Georgia Laws',q:'Georgia\u2019s Move Over Law requires drivers approaching a stopped emergency vehicle to:',o:['Move over one lane, or slow below the speed limit if moving over is unsafe','Stop completely until it leaves','Sound the horn and continue','Move to the far left lane only'],a:0,w:'Move over a lane when safely possible. If not, slow below the posted limit and be prepared to stop. It covers emergency, sanitation, and utility vehicles.',src:'Manual, Section 5'},
{id:'m69',t:'Georgia Laws',q:'Georgia\u2019s Hands-Free Law applies to:',o:['All drivers, regardless of age','Drivers under 21 only','Drivers under 18 only','Commercial drivers only'],a:0,w:'The Hands-Free Law bans holding or supporting a phone with any part of the body, for every driver on any Georgia highway.',src:'Manual, Section 5'},
{id:'m70',t:'Georgia Laws',q:'A first conviction under the Hands-Free Law brings:',o:['1 point and a fine up to $50','3 points and a $150 fine','A warning only','License suspension'],a:0,w:'First conviction is 1 point and up to $50. Second is 2 points and up to $100. Third and beyond is 3 points and up to $150.',src:'Manual, Section 5'},
{id:'m71',t:'Georgia Laws',q:'The Slow Poke Law requires that you:',o:['Move out of the passing lane when faster traffic approaches','Never exceed 55 mph in the left lane','Stay in the left lane on multi-lane roads','Signal before slowing down'],a:0,w:'HB 459 requires slower drivers to move right out of the passing lane when faster traffic approaches, regardless of the speed you are traveling.',src:'Manual, Section 5'},
{id:'m72',t:'Georgia Laws',q:'Littering from a vehicle in Georgia is:',o:['A misdemeanor with a fine up to $1,000 and up to 12 months','A civil citation only','A $50 fixed fine','Not enforceable against drivers'],a:0,w:'The Litter Control Law treats littering as damage to property. A judge may also order cleanup duty.',src:'Manual, Section 5'},
{id:'m73',t:'Georgia Laws',q:'You may not follow a responding fire truck closer than:',o:['200 feet','100 feet','500 feet','50 feet'],a:0,w:'Stay at least 200 feet back from responding fire apparatus, and never park within 500 feet of fire apparatus stopped at an alarm.',src:'Manual, Section 5'},
{id:'m74',t:'Sharing the Road',q:'A vehicle displaying an orange triangle emblem is:',o:['Traveling under 25 mph','A hazardous materials carrier','An emergency vehicle','A wide load'],a:0,w:'The slow-moving vehicle emblem is required on any vehicle traveling under 25 mph.',src:'Manual, Section 7'},
{id:'m75',t:'Sharing the Road',q:'When turning right where a bicycle lane is present, you must:',o:['Yield to cyclists going straight through the intersection','Turn ahead of the cyclist','Stop in the bike lane and wait','Sound your horn first'],a:0,w:'You must yield to bicyclists traveling straight before completing your right turn, and you may only cross a bike lane to turn.',src:'Manual, Section 5'},
{id:'m76',t:'Sharing the Road',q:'Approaching a postal vehicle with flashing lights, you must:',o:['Change lanes if possible, or slow to 10 mph under the limit or 25 mph, whichever is more','Stop completely','Pass at normal speed','Sound your horn and pass'],a:0,w:'The same rule that protects bicycles and sanitation workers applies. A violation carries a fine up to $250.',src:'Manual, Section 5'},
{id:'m77',t:'Testing & Permits',q:'To pass the Georgia knowledge exam you must score at least:',o:['15 out of 20 on both the road signs and road rules tests','30 out of 40 combined','15 out of 20 on either test','18 out of 20 on both tests'],a:0,w:'Each part is scored separately and each requires 15 of 20. A perfect score on one part does not offset a failure on the other.',src:'Manual, Section 3'},
{id:'m78',t:'Testing & Permits',q:'If you fail part of the knowledge exam for the first time, you must wait:',o:['1 day before retesting','7 days','30 days','You may retest the same day'],a:0,w:'One day after a first failure, seven days after any subsequent failure, and the fee is paid again on every attempt.',src:'Manual, Section 3'},
{id:'m79',t:'Testing & Permits',q:'The minimum vision requirement for a Georgia non-commercial license is:',o:['20/60 in one eye and a 140-degree field of vision','20/20 in both eyes','20/40 in both eyes','20/100 in one eye'],a:0,w:'20/60 in one eye with or without corrective lenses, plus a horizontal field of vision of at least 140 degrees.',src:'Manual, Section 1'},
{id:'m80',t:'Testing & Permits',q:'An applicant under 18 must present which document at the DDS?',o:['A Certificate of School Enrollment, diploma, or GED','A birth certificate only','A school report card','A letter from a teacher'],a:0,w:'Proof of school enrollment is required, along with identity documents, Social Security number, two proofs of Georgia residency, and a responsible adult\u2019s signature.',src:'Manual, Section 6'}
];

/* ---------- official Georgia DDS practice-test additions ---------- */
const DDS_OFFICIAL_RULES=[
{id:'dds1',t:'Safe Driving',q:'When must you lower high beams at night?',o:['At every intersection','When meeting or following another vehicle','Only after another driver flashes their lights'],a:1,w:'Dim high beams when meeting or following another vehicle so you do not create glare.',src:'Official GA DDS Practice Test · question 1'},
{id:'dds2',t:'Georgia Laws',q:'Who must obey Georgia’s Hands-Free Law?',o:['Every driver, regardless of age','Only drivers under 21','Only drivers under 18','Only commercial drivers'],a:0,w:'Georgia’s Hands-Free Law applies to every driver, regardless of age.',src:'Official GA DDS Practice Test · question 2'},
{id:'dds3',t:'Georgia Laws',q:'What should you do when approaching a stopped emergency vehicle with flashing lights?',o:['Move over one lane when safe, or slow below the limit if you cannot','Stop in your lane until it leaves','Sound your horn and continue at the posted speed'],a:0,w:'Georgia’s Move Over Law requires a lane change when safe. If you cannot move over, slow below the posted limit and be ready to stop.',src:'Official GA DDS Practice Test · question 3'},
{id:'dds4',t:'Safe Driving',q:'After a crash, what is one of your immediate responsibilities?',o:['Give reasonable aid to anyone who is injured','Leave to find a police station','Move on if the damage looks minor'],a:0,w:'Stop, exchange required information, and give reasonable aid to injured people after a crash.',src:'Official GA DDS Practice Test · question 4'},
{id:'dds5',t:'Signs & Signals',q:'What does a flashing yellow traffic signal mean?',o:['Slow down and proceed with caution','Stop and wait for a green light','Speed up before the signal changes'],a:0,w:'A flashing yellow signal warns you to slow down and proceed carefully.',src:'Official GA DDS Practice Test · question 5'},
{id:'dds6',t:'Testing & Permits',q:'Where must the supervising licensed driver sit when you drive with an instructional permit?',o:['In the front passenger seat','In any seat in the vehicle','In the back seat directly behind you'],a:0,w:'The supervising licensed driver must sit in the front passenger seat.',src:'Official GA DDS Practice Test · question 6'},
{id:'dds7',t:'Passing',q:'How should you pass a motorcycle?',o:['Use the full adjacent lane to the left','Share the motorcycle’s lane briefly','Pass on the shoulder if it is clear'],a:0,w:'A motorcycle has the full width of its lane. Pass in an adjacent lane; never share the lane.',src:'Official GA DDS Practice Test · question 7'},
{id:'dds8',t:'Safe Driving',q:'Which passengers must be protected by a seat belt or child restraint?',o:['Passengers ages 8 through 18','Only passengers under age 8','Only front-seat passengers over age 8'],a:0,w:'Georgia requires occupants ages 8 through 18 to use a safety belt; younger children need the appropriate restraint system.',src:'Official GA DDS Practice Test · question 8'},
{id:'dds9',t:'Safe Driving',q:'True or false: Driving requires your full attention.',o:['True','False'],a:0,w:'True. Safe driving requires your full attention at all times.',src:'Official GA DDS Practice Test · question 9'},
{id:'dds10',t:'Safe Driving',q:'What is a major nighttime driving hazard?',o:['Reduced visibility of the road ahead','More room to stop than during daylight','Traffic signals being unavailable'],a:0,w:'At night you can see less of the road ahead, so speed and following distance need more care.',src:'Official GA DDS Practice Test · question 10'},

const TF=[
{id:'f1',t:'Right of Way',q:'At an uncontrolled intersection, the driver on the left must yield to the driver on the right.',a:true,w:'Correct. When two vehicles arrive together with no signs or signals, the left yields to the right.'},
{id:'f2',t:'Right of Way',q:'A green light means you may enter the intersection even if it is not yet clear.',a:false,w:'False. The manual is explicit: wait until the intersection is clear. Never proceed "just because" you have the green.'},
{id:'f3',t:'Right of Way',q:'Right of way is something you take, not something you give.',a:false,w:'False. The manual states right of way is given, not taken. If another driver wrongly takes their turn, let them go to avoid a crash.'},
{id:'f4',t:'Right of Way',q:'You must stop for pedestrians in the crosswalk of the road you are turning onto until they clear your lanes.',a:true,w:'Correct. Stop and remain stopped until pedestrians have cleared the lanes you are traveling on.'},
{id:'f5',t:'Right of Way',q:'A left turn on red is always illegal in Georgia.',a:false,w:'False. A left on red is permitted from a one-way street onto a one-way street moving to your left, after a complete stop, unless a sign prohibits it.'},
{id:'f6',t:'Right of Way',q:'You may pass a school bus while its red lights are flashing if you are in a hurry.',a:false,w:'False. Once red lights flash and the stop arm extends, passing is unlawful, no exceptions.'},

{id:'f8',t:'Signs & Signals',q:'A round sign warns of a roundabout ahead.',a:false,w:'False. The round warning sign means a railroad crossing is ahead. It is the shape people most often miss.'},
{id:'f9',t:'Signs & Signals',q:'Vertical rectangular signs are usually regulatory and tell you what you must do.',a:true,w:'Correct. Vertical rectangles are regulatory. Horizontal rectangles are usually guide signs.'},
{id:'f10',t:'Signs & Signals',q:'Warning signs can be fluorescent yellow-green as well as yellow.',a:true,w:'Correct. Fluorescent yellow-green is used for pedestrian, bicycle, and school crossing warnings.'},
{id:'f11',t:'Signs & Signals',q:'A yellow light means speed up to clear the intersection before it turns red.',a:false,w:'False. A yellow light warns the signal is changing to red. Slow down and prepare to stop.'},
{id:'f12',t:'Signs & Signals',q:'A flashing yellow light means you must come to a complete stop.',a:false,w:'False. Flashing yellow means slow down and proceed with caution. Flashing red is the one that requires a full stop.'},
{id:'f13',t:'Signs & Signals',q:'Green signs give directions and locations.',a:true,w:'Correct. Green is the guide sign color for routes, exits, distances, and destinations.'},
{id:'f14',t:'Signs & Signals',q:'A right turn on red is permitted after a complete stop unless a sign prohibits it.',a:true,w:'Correct. Stop fully, yield to all traffic and pedestrians, and turn only when it is clearly safe.'},

{id:'f16',t:'Pavement Markings',q:'You may use the center two-way left turn lane to pass slower traffic.',a:false,w:'False. Georgia law limits that lane to left turns only, entered no more than 300 feet before the turn.'},
{id:'f17',t:'Pavement Markings',q:'Solid white edge lines mark the edge of the pavement.',a:true,w:'Correct. Edge lines are especially useful as a guide at night and in poor visibility.'},
{id:'f18',t:'Pavement Markings',q:'Drivers may park in a bicycle lane as long as they are not blocking traffic.',a:false,w:'False. Driving or parking in a bike lane is prohibited. You may only cross it to make a turn, yielding to cyclists.'},
{id:'f19',t:'Passing',q:'You may pass on the shoulder if the vehicle ahead is turning left.',a:false,w:'False. Passing on the shoulder is prohibited. You may pass on the right only when there is enough pavement width in a legal lane, or on a multi-lane road.'},
{id:'f20',t:'Passing',q:'Passing is prohibited at all railroad crossings.',a:true,w:'Correct, and also within 100 feet of a crossing, bridge, viaduct, or tunnel.'},
{id:'f21',t:'Passing',q:'A motorcyclist is entitled to the full width of a lane.',a:true,w:'Correct. Drivers may not share a lane with a motorcycle while passing.'},
{id:'f22',t:'Passing',q:'You may cross a double solid yellow line to pass if the road ahead looks clear.',a:false,w:'False. Double solid yellow means passing is prohibited in both directions.'},
{id:'f23',t:'Speed & Limits',q:'The general speed limit on an urban interstate in Georgia is 65 mph unless posted otherwise.',a:true,w:'Correct. Urban interstates and multi-lane divided highways are 65. Rural interstates are 70.'},
{id:'f24',t:'Speed & Limits',q:'Driving well under the speed limit is always safe and legal.',a:false,w:'False. Impeding the normal flow of traffic is prohibited and carries a fine up to $1,000 and 3 points.'},
{id:'f25',t:'Speed & Limits',q:'The Super Speeder fee is $200 and is added on top of any local fine.',a:true,w:'Correct, and failing to pay it on time brings a suspension plus a $50 reinstatement fee.'},
{id:'f26',t:'Teen Licensing',q:'A Class C Instructional Permit is valid for two years.',a:true,w:'Correct. You can apply at 15, and the permit remains valid for two years.'},
{id:'f27',t:'Teen Licensing',q:'A 16-year-old with a Class D license may drive to work at 1:00 a.m.',a:false,w:'False. The midnight to 5:00 a.m. curfew has no exceptions, including work.'},
{id:'f28',t:'Teen Licensing',q:'A Class D holder may carry three non-family passengers under 21 after holding the license 12 months.',a:true,w:'Correct. Immediate family only for six months, then one non-family passenger under 21, then up to three.'},

{id:'f31',t:'Teen Licensing',q:'An ADAP certificate is required before a Class D license is issued.',a:true,w:'Correct. The Alcohol and Drug Awareness Program is taught in most schools and is also available online.'},
{id:'f32',t:'Alcohol & Penalties',q:'A driver who is 20 years old is legally under the influence at 0.08.',a:false,w:'False. Under 21, the limit is 0.02. Only drivers 21 and older are measured at 0.08.'},

{id:'f34',t:'Alcohol & Penalties',q:'For a driver under 21, a single 4-point conviction can suspend the license.',a:true,w:'Correct. Under 21, any conviction carrying four or more points brings a suspension.'},
{id:'f35',t:'Safe Driving',q:'You should brake hard as soon as you feel the car hydroplaning.',a:false,w:'False. Ease off the accelerator and let the car slow. Braking hard can throw you into an uncontrollable skid.'},

{id:'f37',t:'Safe Driving',q:'You should dim your headlights when following within 200 feet of another vehicle.',a:true,w:'Correct, and within 500 feet of an oncoming vehicle, on lighted roads, and in rain, fog, snow, or smoke.'},
{id:'f38',t:'Safe Driving',q:'High beams help you see better in heavy fog.',a:false,w:'False. High beams reflect off fog and reduce visibility. Use low beams.'},
{id:'f39',t:'Safe Driving',q:'Overdriving your headlights means driving so fast that you cannot stop within the distance they light up.',a:true,w:'Correct. At night, your safe speed is limited by how far ahead you can actually see.'},
{id:'f40',t:'Safe Driving',q:'Georgia is a primary enforcement state for seat belts.',a:true,w:'Correct. An officer may stop and cite you for the belt violation alone, without any other violation.'},

/* ============================================================

const store={
  async get(){
    try{ if(window.storage){ const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value) } }catch(e){}
    try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null }catch(e){ return null }
  },
  async set(o){
    const s=JSON.stringify(o);
    try{ if(window.storage){ await window.storage.set(KEY,s); return } }catch(e){}
    try{ localStorage.setItem(KEY,s) }catch(e){}
  }
};

function assertMockCatalog(){
  const dds=[...DDS_OFFICIAL_RULES,...DDS_OFFICIAL_SIGNS];
  const expected=new Set([...Array.from({length:41},(_,i)=>'dds'+(i+1)),'dds43','dds44','dds45','dds46','dds48','dds49','dds50']);
  const ids=new Set(dds.map(q=>q.id));
  const malformed=dds.some(q=>!q.q||!q.w||!q.src||!Array.isArray(q.o)||q.o.length<2||!Number.isInteger(q.a)||q.a<0||q.a>=q.o.length);
  const missingSign=DDS_OFFICIAL_SIGNS.some(q=>!SIGNS.some(s=>s.id===q.sign));
  if(
    dds.length!==48||ids.size!==48||expected.size!==48||[...expected].some(id=>!ids.has(id))||malformed||missingSign||
    MOCK_ITEMS.length!==MOCK_BANK_TOTAL||MOCK_SIGN_ITEMS.length!==MOCK_SIGN_BANK_TOTAL||MOCK_RULE_ITEMS.length!==MOCK_RULE_BANK_TOTAL||
    new Set(MOCK_ITEMS).size!==MOCK_BANK_TOTAL||MOCK_ITEMS.some(id=>!byId[id])||
    MOCK_EXAM_SIGN_COUNT!==MOCK_SIGN_BANK_TOTAL||MOCK_EXAM_RULE_COUNT!==MOCK_RULE_BANK_TOTAL||
    MOCK_EXAM_SIGN_PASSING_SCORE!==Math.ceil(MOCK_EXAM_SIGN_COUNT*.75)||MOCK_EXAM_RULE_PASSING_SCORE!==Math.ceil(MOCK_EXAM_RULE_COUNT*.75)
  ) throw new Error('Invalid mock catalog: expected 88 unique answerable items.');
}

const rec=id=>P.items[id]||(P.items[id]={box:0,seen:0,right:0,wrong:0,streak:0,last:0});
function grade(id,ok){
  const r=rec(id); r.seen++; r.last=Date.now();
  if(ok){ r.right++; r.streak++; r.box=Math.min(5,r.box+1); r.lastOutcome='right'; P.correct++ }
  else { r.wrong++; r.streak=0; r.box=Math.max(0,r.box-2); r.lastOutcome='wrong'; r.lastWrong=r.last }
  P.answered++;
  recent.push(id); if(recent.length>8) recent.shift();
  save();
}
function mockPracticeState(){
  if(!P.mockPractice||typeof P.mockPractice!=='object') P.mockPractice={passed:{},missed:{}};
  if(!P.mockPractice.passed||typeof P.mockPractice.passed!=='object') P.mockPractice.passed={};
  if(!P.mockPractice.missed||typeof P.mockPractice.missed!=='object') P.mockPractice.missed={};
  return P.mockPractice;
}
function mockPracticePending(){
  const state=mockPracticeState();
  return MOCK_ITEMS.filter(id=>!state.passed[id]);
}
function updateMockPractice(id,ok){
  if(!MOCK_ITEMS.includes(id)) return;
  const state=mockPracticeState();
  if(ok){ state.passed[id]=true; delete state.missed[id] }
  else { delete state.passed[id]; state.missed[id]=true }
  save();
}
function returnMockQuestionToPractice(id){
  if(!MOCK_ITEMS.includes(id)) return;
  const state=mockPracticeState();
  delete state.passed[id]; state.missed[id]=true;
  save();
}
function pick(pool,n){
  const out=[],avail=pool.slice();
  for(let i=0;i<n&&avail.length;i++){
    const w=avail.map(id=>{
      const r=P.items[id]; let x=BOXW[r?r.box:0];
      if(r&&r.wrong>r.right) x*=1.6;
      if(recent.includes(id)) x*=0.15;
      return x;
    });
    let tot=w.reduce((a,b)=>a+b,0),roll=Math.random()*tot,k=0;
    while(roll>w[k]&&k<w.length-1){roll-=w[k];k++}
    out.push(avail.splice(k,1)[0]);
  }
  return out;
}
function readiness(pool){
  let s=0; pool.forEach(id=>{const r=P.items[id]; s+=Math.min(r?r.box:0,4)});
  return pool.length?s/(pool.length*4):0;
}
const mastered=pool=>pool.filter(id=>{const r=P.items[id];return r&&r.box>=5&&r.streak>=2}).length;
function trouble(n){
  return ALL_ITEMS.filter(id=>{const r=P.items[id];return r&&r.wrong>0&&r.box<4})
    .sort((a,b)=>{const x=P.items[a],y=P.items[b];return y.wrong-x.wrong||x.box-y.box}).slice(0,n);
}
function homeReviewQueue(n=2){
  const missed=Object.entries(P.items)
    .filter(([id,r])=>byId[id]&&r&&r.wrong>0&&(r.lastOutcome? r.lastOutcome==='wrong':true))
    .sort(([,a],[,b])=>(b.lastWrong||b.last||0)-(a.lastWrong||a.last||0)||b.wrong-a.wrong)
    .map(([id])=>id).slice(0,n);
  return missed.length?{ids:missed,missed:true}:{ids:pick(Object.keys(byId),n),missed:false};
}
function homeReviewRow(id,missed){
  const q=toQ(id),r=P.items[id];
  const visual=q.art
    ? `<span class="home-v2-review-sign">${q.art}</span>`
    : '<span class="home-v2-review-sign"><span class="home-v2-review-kind" aria-hidden="true">Q</span></span>';
  const detail=missed
    ? `Missed ${r.wrong} time${r.wrong===1?'':'s'} · review it now.`
    : 'Random question · answer it now.';
  return `<button class="home-v2-review-row" data-go="review-question:${id}">
    ${visual}<span class="home-v2-review-copy"><span class="home-v2-review-topic">${esc(q.topic)}</span><b>${esc(q.q)}</b><em>${detail}</em></span><i aria-hidden="true">›</i>
  </button>`;
}
function markDay(){
  const d=new Date(),k=d.toISOString().slice(0,10);
  if(P.lastDay===k) return;
  const y=new Date(d.getTime()-864e5).toISOString().slice(0,10);
  P.streak=(P.lastDay===y)?P.streak+1:1; P.lastDay=k;
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* builds a 4-option question object from any item id */
function toQ(id){
  const it=byId[id];
  if(it.kind==='sign'){
    const s=it.d;
    const pool=shuffle(SIGNS.filter(x=>x.id!==s.id&&x.c===s.c)).slice(0,3);
    while(pool.length<3){const r=SIGNS[Math.floor(Math.random()*SIGNS.length)];if(r.id!==s.id&&!pool.includes(r))pool.push(r)}
    const opts=shuffle([s,...pool]);
    return{id,sec:'signs',topic:'Road Signs',art:s.s,q:'What does this sign mean?',
      o:opts.map(x=>x.n),a:opts.indexOf(s),w:s.m,src:'Manual, Section 7'};
  }
  if(it.kind==='mc'||it.kind==='dds'){const q=it.d;
    const sign=q.sign?SIGNS.find(s=>s.id===q.sign):null;
    const idx=shuffle(q.o.map((_,i)=>i));
    return{id,sec:sign?'signs':'rules',topic:sign?'Road Signs':q.t,art:sign?sign.s:null,q:q.q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),w:q.w,src:q.src};}
  if(it.kind==='source'){const q=it.d;
    const sign=q.sign?SIGNS.find(s=>s.id===q.sign):null;
    return{id,sec:'source',topic:q.t,art:sign?sign.s:null,q:q.q,o:q.o,a:q.a,w:q.w,src:q.src};}
  const q=it.d;
  return{id,sec:'rules',topic:q.t,art:null,q:q.q,o:['True','False'],a:q.a?0:1,w:q.w,src:'Manual'};
}

let TAB='home';
function syncMenuLinks(){
  document.querySelectorAll('[data-menu-go]').forEach(b=>{
    const active=b.dataset.menuGo===TAB;
    b.classList.toggle('on',active);
    if(active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  syncMenuSummary();
}
function syncMenuSummary(){
  const mile=pct((readiness(SIGN_ITEMS)+readiness(RULE_ITEMS))/2);
  const progress=Math.max(0,Math.min(100,mile));
  const questions=P.answered||0;
  const routeCopy=questions
    ? `${questions} question${questions===1?'':'s'} answered · keep the route moving.`
    : 'Start a short drill to establish your route.';
  document.querySelectorAll('[data-menu-mile]').forEach(el=>el.textContent=progress);
  document.querySelectorAll('[data-menu-route-copy]').forEach(el=>el.textContent=routeCopy);
  document.querySelectorAll('[data-menu-progress-fill]').forEach(el=>el.style.width=`${progress}%`);

function setMenu(open){
  const menu=$('#app-menu'),toggle=$('[data-menu-toggle]');
  if(!menu||!toggle) return;
  const visible=Boolean(open);
  $('#app').classList.toggle('menu-open',visible);
  menu.setAttribute('aria-hidden',String(!visible));
  menu.inert=!visible;
  toggle.setAttribute('aria-expanded',String(visible));
  toggle.setAttribute('aria-label',visible?'Close primary navigation':'Open primary navigation');
  syncMenuLinks();
  if(visible) requestAnimationFrame(()=>menu.querySelector('[data-menu-go].on,[data-menu-go]')?.focus());

}

function playHomeConfetti(){

  const end=Date.now()+(15*1000);
  const colors=['#bb0000','#ffffff'];

function bindDriversManualReader(){
  const root=view(),search=root.querySelector('[data-ga-manual-search]'),result=root.querySelector('[data-ga-manual-result]'),expand=root.querySelector('[data-ga-manual-expand]');
  const sections=[...root.querySelectorAll('[data-ga-manual-section]')];
  search.addEventListener('input',()=>{
    const query=search.value.trim().toLocaleLowerCase();
    let shown=0;
    sections.forEach(section=>{
      const match=!query||section.textContent.toLocaleLowerCase().includes(query);
      section.hidden=!match;
      if(query&&match) section.open=true;
      if(match) shown++;
    });
    result.hidden=shown!==0;
  });
  expand.addEventListener('click',()=>{
    const open=expand.getAttribute('aria-pressed')!=='true';
    sections.filter(section=>!section.hidden).forEach(section=>section.open=open);
    expand.setAttribute('aria-pressed',String(open));
    expand.textContent=open?'Collapse all':'Expand all';
  });
  root.querySelectorAll('[data-ga-manual-jump]').forEach(button=>button.addEventListener('click',()=>{
    const section=root.querySelector('#'+CSS.escape(button.dataset.gaManualJump));
    if(!section||section.hidden) return;
    section.open=true;
    section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  }));
}

function startSwipe(){

function renderSwipe(){
  if(S.i>=S.queue.length) return finish();
  drillBar();
  const q=byId[S.queue[S.i]].d; S.q=q;
  const remaining=S.queue.length-S.i;
  const backing=Math.min(3,Math.max(0,remaining-1));
  const spread=8+Math.min(remaining,9)*.75;
  const stack=Array.from({length:backing},(_,index)=>{
    const layer=backing-index;
    return `<div class="swipe stack-card" style="--stack-layer:${layer};--stack-y:${layer*spread}px;--stack-scale:${1-layer*.025};--stack-opacity:${.88-layer*.12};--stack-shadow-y:${layer*5}px" aria-hidden="true"><span>Flash card</span><b>${S.i+1+layer}</b></div>`;
  }).join('');
  view().innerHTML=`<div class="screen">
    <p class="swipe-instruction" role="note">Swipe right for true, swipe left for false.</p>
    <div class="deck flash-deck" style="--stack-spread:${spread}px" aria-label="${remaining} flash card${remaining===1?'':'s'} remaining">
      ${stack}
      <div class="deck-count" aria-hidden="true"><b>${remaining}</b><span>cards left</span></div>
      <div class="swipe top-card" id="top">
        <div class="stamp t" id="stt">TRUE</div><div class="stamp f" id="stf">FALSE</div>

      </div>

      <button class="tfbtn t" data-tf="1">True</button>
    </div>
    <div id="after"></div>
  </div>`;
  bindSwipe();
}
function bindSwipe(){
  const c=$('#top'); if(!c) return;
  let x0=0,dx=0,down=false;
  const set=v=>{c.style.transform=`translateX(${v}px) rotate(${v/26}deg)`;
    $('#stt').style.opacity=v>25?Math.min(1,(v-25)/60):0;
    $('#stf').style.opacity=v<-25?Math.min(1,(-v-25)/60):0};
  c.addEventListener('pointerdown',e=>{if(S.answered)return;down=true;x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'});
  c.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-x0;set(dx)});
  c.addEventListener('pointerup',()=>{if(!down)return;down=false;c.style.transition='transform .26s var(--ease)';
    if(Math.abs(dx)>78) answerTF(dx>0?1:0); else {set(0);dx=0}});
  c.addEventListener('pointercancel',()=>{down=false;c.style.transition='transform .26s var(--ease)';set(0);dx=0});
}
function answerTF(v){
  if(S.answered) return; S.answered=true;
  const q=S.q,said=v===1,ok=said===q.a;
  if(ok) S.right++; else S.wrongIds.push('t:'+q.id);
  grade('t:'+q.id,ok);
  const c=$('#top');
  c.style.transition='transform .26s var(--ease),opacity .26s';
  c.style.transform=`translateX(${v?420:-420}px) rotate(${v?14:-14}deg)`; c.style.opacity='0';
  document.querySelectorAll('.tfbtn').forEach(b=>b.disabled=true);
  $('#after').innerHTML=`<div style="height:14px"></div><div class="why">
      <div class="v ${ok?'ok':'no'}">${ok?'Correct':'Not quite'} \u00b7 answer is ${q.a?'True':'False'}</div>
      <p>${esc(q.w)}</p></div>
    <div style="height:14px"></div>
    <button class="btn" data-go="next">${S.i+1>=S.queue.length?'See results':'Next card'}</button>`;
}

function matchTap(kind,id){
  if(S.done.includes(id)) return;
  if(kind==='mt'){
    if(S.sel&&S.sel.kind==='mt'){document.querySelector(`[data-mt="${S.sel.id}"]`).classList.remove('sel')}
    if(S.sel&&S.sel.kind==='nt') return tryPair(id,S.sel.id);
    S.sel={kind:'mt',id}; document.querySelector(`[data-mt="${id}"]`).classList.add('sel');
  } else {
    if(S.sel&&S.sel.kind==='nt'){document.querySelector(`[data-nt="${S.sel.id}"]`).classList.remove('sel')}
    if(S.sel&&S.sel.kind==='mt') return tryPair(S.sel.id,id);
    S.sel={kind:'nt',id}; document.querySelector(`[data-nt="${id}"]`).classList.add('sel');
  }
}
function tryPair(signId,nameId){
  const a=document.querySelector(`[data-mt="${signId}"]`),b=document.querySelector(`[data-nt="${nameId}"]`);
  a.classList.remove('sel'); b.classList.remove('sel'); S.sel=null;
  const ok=signId===nameId;
  grade(signId,ok);
  if(ok){
    S.right++; S.i++; S.done.push(signId);
    a.classList.add('done'); b.classList.add('done');
    drillBar();
    if(S.done.length===S.pairs.length){
      S.round++;
      setTimeout(()=>{S.round<3&&S.round*4<S.queue.length?renderMatch():finish()},520);
    }
  } else {
    S.wrongIds.push(signId);
    [a,b].forEach(el=>{el.classList.add('shake');el.style.borderColor='var(--red-lit)';
      setTimeout(()=>{el.classList.remove('shake');el.style.borderColor=''},420)});
  }
}

/* ---------- shared mock test catalog, trainer, and practice ---------- */
function buildMockQueue(){
  const signs=shuffle(MOCK_SIGN_ITEMS);
  const rules=shuffle(MOCK_RULE_ITEMS);
  return {queue:[...signs,...rules],nSign:signs.length,signPassing:MOCK_EXAM_SIGN_PASSING_SCORE,rulePassing:MOCK_EXAM_RULE_PASSING_SCORE};
}
function assertMockExamQueue(){
  const mock=buildMockQueue();
  const signs=mock.queue.slice(0,mock.nSign);
  const rules=mock.queue.slice(mock.nSign);
  if(
    mock.queue.length!==MOCK_BANK_TOTAL||new Set(mock.queue).size!==MOCK_BANK_TOTAL||mock.nSign!==MOCK_EXAM_SIGN_COUNT||
    mock.signPassing!==MOCK_EXAM_SIGN_PASSING_SCORE||mock.rulePassing!==MOCK_EXAM_RULE_PASSING_SCORE||
    signs.some(id=>!MOCK_SIGN_ITEMS.includes(id))||rules.some(id=>!MOCK_RULE_ITEMS.includes(id))
  ) throw new Error('Invalid Mock Permit Test: expected all 88 questions with section pass thresholds.');
}
assertMockExamQueue();
function startMockExam(){
  const {queue,nSign,signPassing,rulePassing}=buildMockQueue();
  S={mode:'mc',queue,i:0,right:0,answered:false,exam:true,nSign,signPassing,rulePassing,wrongIds:[],title:'Mock Permit Test'};
  chrome(false,S.title); renderMC();
}
function startMockTrainer(){
  S={mode:'mc',queue:MOCK_ITEMS.slice(),i:0,right:0,answered:false,exam:false,mockTrainer:true,wrongIds:[],title:'Mock Test Trainer'};
  chrome(false,S.title); renderMC();
}
function buildMockPracticeQueue(){
  const state=mockPracticeState();
  const pending=mockPracticePending();
  const missed=pending.filter(id=>state.missed[id]);
  const fresh=pending.filter(id=>!state.missed[id]);
  const missedSet=pick(missed,Math.min(10,missed.length));
  return [...missedSet,...pick(fresh,10-missedSet.length)];
}
function startMockPractice(){
  const queue=buildMockPracticeQueue();
  if(!queue.length) return screenMockPracticeMastery();
  S={mode:'mc',queue,i:0,right:0,answered:false,exam:false,mockPractice:true,wrongIds:[],title:'Mock Practice Test'};
  chrome(false,S.title); renderMC();
}
function screenMockPracticeMastery(){
  S=null; chrome(true,'Mock Practice Test'); $('#topslot').innerHTML=''; TAB='drills'; nav();
  view().innerHTML=`<div class="screen mock-practice-mastery">
    <p class="eyebrow">Mock practice</p><h2>All ${MOCK_BANK_TOTAL} questions passed</h2>
    <div class="result pass"><div class="rt">Practice pool cleared</div><div class="rv">${MOCK_BANK_TOTAL} / ${MOCK_BANK_TOTAL}</div><div class="rs">Every mock question is passed</div></div>
    <p class="lede">A missed question on a future Mock Permit Test will return here for another pass.</p>
    <button class="btn" data-go="mock-exam">Take the Mock Permit Test</button>
    <div style="height:10px"></div><button class="btn ghost" data-go="drills">Back to drills</button>
  </div>`;
}

/* ---------- finish ---------- */
function mockPracticeReview(id){
  const q=toQ(id);
  return `<article class="mock-practice-review">
    <div class="mock-practice-review-head">${q.art?`<div class="signbox mock-practice-review-art">${q.art}</div>`:''}<div><p class="eyebrow">${esc(q.topic)}</p><h3>${esc(q.q)}</h3></div></div>
    <div class="mock-practice-trainer"><b>Trainer explanation</b><p>${esc(q.w)}</p><span class="src">${esc(q.src||'Mock Test Trainer')}</span></div>
  </article>`;
}
function finishMockPractice(total,right,wrong){
  const remaining=mockPracticePending().length;
  const passedSet=right===total;
  const fullSet=total===10;
  const headline=remaining===0?'All mock questions passed':passedSet?(fullSet?'You passed all 10 questions':'You passed this final set'):'Practice set scored';
  const detail=remaining===0?`Every question in the ${MOCK_BANK_TOTAL}-question mock pool is now passed.`:passedSet?'Those questions are cleared. Continue to the next set when you are ready.':`${wrong.length} question${wrong.length===1?' was':'s were'} returned to your practice list.`;
  chrome(true,'Mock Practice Results'); $('#topslot').innerHTML='';
  view().innerHTML=`<div class="screen mock-practice-results">
    <p class="eyebrow">Mock practice results</p><h2>${headline}</h2>
    <div class="result ${passedSet?'pass':'fail'}"><div class="rt">This set</div><div class="rv">${right} / ${total}</div><div class="rs">${remaining} of ${MOCK_BANK_TOTAL} still in practice</div></div>
    <p class="lede">${detail}</p>
    ${wrong.length?`<section class="panel mock-practice-review-list"><p class="panel-t">Review missed questions</p>${wrong.map(mockPracticeReview).join('')}</section>`:`<div class="panel mock-practice-celebration"><p class="panel-t">${fullSet?'Clean set':'Final set cleared'}</p><p>${fullSet?'You passed all 10 questions. Start the next set to keep clearing the mock pool.':'You passed every remaining mock question.'}</p></div>`}
    ${remaining?`<button class="btn" data-go="mock-practice">${passedSet&&fullSet?'Start the next 10 questions':'Continue with the next set'}</button><div style="height:10px"></div>`:`<button class="btn" data-go="mock-exam">Take the Mock Permit Test</button><div style="height:10px"></div>`}
    <button class="btn ghost" data-go="drills">Back to drills</button>
  </div>`;
  S.lastWrong=wrong.slice();
}
function finish(){
  const total=S.queue.length,right=S.right,wrong=S.wrongIds;
  if(S.exam) P.mockExam={percent:total?Math.round(right/total*100):0,right,total,finishedAt:Date.now()};
  P.drills++; markDay(); save();
  if(S.mockPractice) return finishMockPractice(total,right,wrong);
  chrome(true,'Session Results'); $('#topslot').innerHTML='';
  let head='',skipped=0;
  if(S.exam){
    const answered=S.queue.slice(0,Math.min(total,S.i+(S.answered?1:0)));
    const answeredSigns=answered.slice(0,S.nSign);
    const answeredRules=answered.slice(S.nSign);
    const sr=answeredSigns.filter(id=>!S.wrongIds.includes(id)).length;
    const rr=answeredRules.filter(id=>!S.wrongIds.includes(id)).length;
    const nr=total-S.nSign;
    const signNeed=S.signPassing||MOCK_EXAM_SIGN_PASSING_SCORE;
    const ruleNeed=S.rulePassing||MOCK_EXAM_RULE_PASSING_SCORE;
    const sp=sr>=signNeed,rp=rr>=ruleNeed;
    const remaining=total-answered.length;
    skipped=remaining;
    head=`<div class="result ${sp?'pass':'fail'}"><div class="rt">Road signs</div><div class="rv">${sp?'Pass':'Not yet'}</div><div class="rs">${sr} / ${S.nSign} \u00b7 need ${signNeed}</div></div>
      <div class="result ${rp?'pass':'fail'}"><div class="rt">Road rules</div><div class="rv">${rp?'Pass':'Not yet'}</div><div class="rs">${rr} / ${nr} \u00b7 need ${ruleNeed}</div></div>
      <p class="lede">${remaining?`Exam ended early. ${remaining} unanswered question${remaining===1?'':'s'} count as incorrect.`:sp&&rp?'Both sections cleared. Keep running mock exams until this is repeatable, not lucky.':'Each section is scored on its own, so a strong half never rescues a weak one.'}</p>`;
  } else {
    const p=total?Math.round(right/total*100):0;
    head=`<div class="result ${p>=75?'pass':'fail'}"><div class="rt">Drill complete</div><div class="rv">${right} / ${total}</div><div class="rs">${p}% this session</div></div>`;
  }
  view().innerHTML=`<div class="screen">
    <p class="eyebrow">Results</p><h2>${S.mockTrainer?'Mock test training':S.exam?'Mock exam':'Session'} scored</h2>
    ${head}
    <div class="panel"><p class="panel-t">Back in the rotation</p>
      ${wrong.length?wrong.slice(0,8).map(id=>{const it=byId[id];
        return `<div class="row"><span class="dot" style="background:var(--fed-orange)"></span><span class="txt">${esc((it.kind==='sign'?it.d.n:it.d.q).slice(0,70))}</span></div>`}).join('')
        :skipped?'<p class="empty">This exam ended before the remaining questions could be scored.</p>':'<p class="empty">Nothing missed. Those items moved up a box and will show up less often now.</p>'}
    </div>
    ${wrong.length?`<button class="btn" data-go="review">Drill the ${wrong.length} you missed</button><div style="height:10px"></div>`:''}
    <button class="btn ghost" data-go="drills">Back to drills</button>
  </div>`;
  S.lastWrong=wrong.slice();
}

/* ============================================================
   ROUTER + EVENTS
   ============================================================ */
function go(k){
  if(k!=='home') stopHomeConfetti();
  if(k!=='next') $('#main').scrollTop=0;
  if(k.startsWith('review-question:')){
    const id=k.slice('review-question:'.length);
    return byId[id]?startMC([id],false,'Question Review'):screenHome();
  }
  if(k.startsWith('topic:')){
    const topic=decodeURIComponent(k.slice('topic:'.length));
    const pool=ALL_ITEMS.filter(id=>byId[id].t===topic);
    return startMC(pick(pool,Math.min(10,pool.length)),false,topic);
  }
  switch(k){
    case 'home': S=null; return screenHome();
    case 'drills': S=null; return screenDrills();
    case 'manual': S=null; return screenManual();
    case 'read-manual': S=null; return screenDriversManual();
    case 'prog': S=null; return screenProgress();
    case 'match': return startMatch();
    case 'swipe': return startSwipe();
    case 'mc': return startMC(pick(ALL_ITEMS,10),false,'Multiple Choice');
    case 'mock-exam': return startMockExam();
    case 'mock-practice': return startMockPractice();
    case 'mock-train': return startMockTrainer();
    case 'auto': {
      const sp=readiness(SIGN_ITEMS),rp=readiness(RULE_ITEMS);
      const t=trouble(10);
      if(t.length>=6) return startMC(t,false,'Trouble Spots');
      return sp<=rp?startMatch():startMC(pick(RULE_ITEMS,10),false,'Road Rules');
    }
    case 'focus': { const t=trouble(10); return t.length?startMC(t,false,'Focused Review'):screenDrills() }
    case 'review': { const w=(S&&S.lastWrong)||[]; return w.length?startMC(w,false,'Missed Questions'):screenDrills() }
    case 'next': return next();
    case 'end': {
      if(S&&S.i>0){ P.drills++; markDay(); save(); return finish() }
      S=null; return screenDrills();
    }
    case 'reset': {
      if(!confirm('Erase every box level, streak, and score? This cannot be undone.')) return;
      P={items:{},drills:0,lastDay:null,streak:0,answered:0,correct:0,mockExam:null,mockPractice:{passed:{},missed:{}}}; recent=[]; save(); return screenProgress();
    }
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.menuToggle!==undefined) return setMenu(!$('#app').classList.contains('menu-open'));
  if(b.dataset.menuClose!==undefined) return setMenu(false);
  if(b.dataset.menuGo){ setMenu(false); return go(b.dataset.menuGo); }
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.opt!==undefined) return answerMC(+b.dataset.opt);
  if(b.dataset.tf!==undefined) return answerTF(+b.dataset.tf);
  if(b.dataset.mt) return matchTap('mt',b.dataset.mt);
  if(b.dataset.nt) return matchTap('nt',b.dataset.nt);
  if(b.dataset.mtab){ MTAB=b.dataset.mtab; return screenManual() }
  if(b.dataset.filt){ MFILT=b.dataset.filt; return screenManual() }
  if(b.dataset.sign) return signSheet(b.dataset.sign);
  if(b.dataset.acc!==undefined){
    const body=$('#acc'+b.dataset.acc); body.classList.toggle('hidden');
    const closed=body.classList.contains('hidden');
    b.setAttribute('aria-expanded',String(!closed));
    b.lastElementChild.textContent=closed?'+':'\u2013';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#app').classList.contains('menu-open')){
    e.preventDefault(); setMenu(false); return;
  }
  if(!S) return;
  if(S.mode==='mc'&&!S.answered&&/^[1-4]$/.test(e.key)){
    const n=+e.key-1; if(S.q&&n<S.q.o.length) answerMC(n);
  }
  if(S.mode==='swipe'&&!S.answered){
    if(e.key==='ArrowRight') answerTF(1);
    if(e.key==='ArrowLeft') answerTF(0);
  }
  if(e.key==='Enter'&&S.answered) next();
});

/* ---------- boot ---------- */
(async function(){
  const saved=await store.get();
  if(saved&&saved.items) P=Object.assign(P,saved);
  const d=new Date().toISOString().slice(0,10);
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(P.lastDay&&P.lastDay!==d&&P.lastDay!==y) P.streak=0;
  $('#streak').innerHTML=`${ICO.flame}<span>${P.streak>0?`${P.streak} day streak`:'Day 1'}</span>`;
  $('#streak').className='chip'+(P.streak>1?' hot':'');
  go('home');
})();
</script>
