<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-labelledby="plate-title plate-description">
  <title id="plate-title">Road Ready Georgia-style license plate</title>
  <desc id="plate-description">A white Georgia-inspired license plate with mounting slots, a peach emblem, and Road Ready lettering.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f7f2"/>
      <stop offset=".35" stop-color="#fff"/>
      <stop offset=".68" stop-color="#e6e6df"/>
      <stop offset="1" stop-color="#fbfbf7"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffcf91"/>
      <stop offset=".52" stop-color="#f99e45"/>
      <stop offset="1" stop-color="#e37126"/>
    </linearGradient>
    <radialGradient id="peach-highlight" cx=".25" cy=".18" r=".8">
      <stop offset="0" stop-color="#fff3dd" stop-opacity=".92"/>
      <stop offset=".43" stop-color="#fff3dd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="4" y="4" width="432" height="212" rx="32" fill="url(#metal)" stroke="#151515" stroke-width="4"/>
    <rect x="14" y="14" width="412" height="192" rx="24" fill="none" stroke="#c9cbc6" stroke-width="1.5"/>
  </g>
  <path d="M27 82H413M27 173H413" fill="none" stroke="#e2e2db" stroke-width="1" opacity=".85"/>
  <path d="M30 26H410M30 193H410" fill="none" stroke="#fff" stroke-width="1" opacity=".9"/>

  <g fill="#e4e4df" stroke="#797b78" stroke-width="1.4">
    <rect x="30" y="45" width="34" height="10" rx="5"/>
    <rect x="376" y="45" width="34" height="10" rx="5"/>
    <rect x="30" y="175" width="34" height="8" rx="4"/>
    <rect x="376" y="175" width="34" height="8" rx="4"/>
  </g>

  <text x="220" y="59" text-anchor="middle" fill="#0d0d0d" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="-1.5">GEORGIA<tspan font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="-.5">.gov</tspan></text>

  <g transform="translate(220 126)">
    <path d="M0-41C-16-54-34-51-43-44C-28-42-14-33-7-20Z" fill="#317735"/>
    <path d="M4-42C17-56 37-51 46-42C29-42 13-33 5-20Z" fill="#4d9340"/>
    <path d="M-3-19C-26-26-45-5-38 24C-32 48-11 61 0 65C13 57 37 43 41 18C45-9 25-27 4-19C1-18-1-18-3-19Z" fill="url(#peach)" stroke="#dc792b" stroke-width="2"/>
    <path d="M-1-16C13-6 17 11 13 26C9 43 2 55 0 65C-15 58-27 44-30 26C-34 2-21-15-5-18Z" fill="#ffe5c0" opacity=".98"/>
    <path d="M-6-11C-1 3-4 18-12 30C-17 38-18 47-15 53C-27 43-34 31-35 17C-37 2-25-12-12-17Z" fill="#317735"/>
    <path d="M0-20C14-15 22-2 23 14C24 31 14 45 0 57" fill="none" stroke="#d96e27" stroke-width="2" opacity=".55"/>
    <ellipse cx="11" cy="-4" rx="27" ry="31" fill="url(#peach-highlight)"/>
  </g>

  <text x="112" y="158" text-anchor="middle" fill="#111" font-family="Impact, 'Arial Narrow', sans-serif" font-size="48" letter-spacing="1">ROAD</text>
  <text x="330" y="158" text-anchor="middle" fill="#111" font-family="Impact, 'Arial Narrow', sans-serif" font-size="43" letter-spacing=".5">READY</text>

  <text x="31" y="201" fill="#30312e" font-family="Arial, sans-serif" font-size="10" font-weight="700">RR-100</text>
  <text x="409" y="201" text-anchor="end" fill="#30312e" font-family="Arial, sans-serif" font-size="10" font-weight="700">GA PERMIT PRACTICE</text>
</svg>
