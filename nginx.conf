server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  autoindex off;

  # The inline app script and stylesheet are pinned with CSP hashes. The UI
  # creates presentational style attributes from bundled, non-user data.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data: https://dds.georgia.gov; object-src 'none'; script-src 'self' 'sha256-0ujANAmxvsiCzq6XAQ1rdrzNFKxqqW0LGr+k1AOiegU='; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com 'sha256-8q3qnuSCw38GJwTf2nWVuB5bqPj5vufbCahYuIZIWG4='; style-src-attr 'unsafe-inline'" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Origin-Agent-Cluster "?1" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location ~* \.(?:bak|conf|dist|fla|ini|log|psd|sh|sql|swp)$ {
    return 404;
  }

  location = /Dockerfile {
    return 404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
